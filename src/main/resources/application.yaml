spring:
  application:
    name: smartcondo-api

  datasource:
    url: jdbc:postgresql://localhost:5433/smartcondo_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
